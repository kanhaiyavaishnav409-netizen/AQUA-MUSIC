name: Build AQUA MUSIC APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK with Gradle in Docker
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/gradle/project \
            -w /home/gradle/project \
            gradle:8.11.1-jdk17 \
            gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aqua-music-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
